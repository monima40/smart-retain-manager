<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart Retail Business Manager</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--background);
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px rgba(22,39,77,0.15);
        }
        .login-card .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-bright));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin: 0 auto 16px;
        }
        .login-card h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 4px;
        }
        .login-card p.subtitle {
            text-align: center;
            color: var(--text-light);
            font-size: 13px;
            margin-bottom: 24px;
        }
        .login-error {
            display: none;
            background: #fee2e2;
            color: #dc2626;
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .login-error.show { display: block; }
        .login-card button.primary-btn {
            width: 100%;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="logo-icon"><i class="fa-solid fa-store"></i></div>

        <h1>Smart Retail</h1>
        <p class="subtitle">Sign in to your Business Manager</p>

        <div class="login-error" id="loginError">Invalid username or password.</div>

        <form id="loginForm">

            <div class="form-group">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" placeholder="admin" required autofocus>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="primary-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In
            </button>

        </form>

    </div>

    <script src="js/auth.js"></script>
</body>
</html>
